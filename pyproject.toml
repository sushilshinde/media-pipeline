[project]
name = "voice-models"
version = "0.1.0"
description = "Voice transcription using WhisperX"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
dependencies = [
    "whisperx>=3.2.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "ffmpeg-python>=0.2.0",
    "pyannote.audio>=3.0.0",
    "pytorch-lightning>=2.0.0"
]
requires-python = ">=3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
